[build-system]
requires = ["setuptools>=80", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberkimi"
version = "0.1.0"
description = "Authorization-bound, evidence-first security analysis harness for Kimi K3"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Esteban Montelongo"}]
dependencies = [
  "cryptography>=45,<48",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0,<7",
]
hunt = ["duckdb>=1.1,<2"]

[project.scripts]
cyberkimi = "cyberkimi.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "integration: integration boundary tests",
  "adversarial: abuse and prompt-injection tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cyberkimi"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["cyberkimi"]

[tool.coverage.report]
fail_under = 80
show_missing = true
