name: Diagnose canonical bundle transport

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  verify-chunks:
    if: github.event.pull_request.head.ref == 'audit/cyberkimi-v0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/replay-cyberkimi-v0.1
      - name: Verify every declared chunk
        shell: bash
        run: |
          set +e
          cd bootstrap
          sha256sum --check chunks.sha256
          status=$?
          echo '--- actual sizes and SHA-256 values ---'
          while read -r _ file; do
            wc -c "$file"
            sha256sum "$file"
          done < chunks.sha256
          exit "$status"
