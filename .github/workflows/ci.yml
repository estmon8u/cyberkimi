name: CI

on:
  push:
    branches:
      - main
      - build/cyberkimi-v0.1
      - audit/cyberkimi-v0.1
  pull_request:

permissions:
  contents: read

concurrency:
  group: cyberkimi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest --cov=cyberkimi --cov-report=term-missing
      - name: Compile
        run: python -m compileall -q src
      - name: CLI smoke
        run: |
          cyberkimi --version
          cyberkimi init --state-directory .test-state
          cyberkimi doctor --state-directory .test-state

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: cyberkimi --version
      - uses: actions/upload-artifact@v4
        with:
          name: cyberkimi-distributions
          path: dist/*
          if-no-files-found: error
