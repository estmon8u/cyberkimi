name: Import preserved CyberKimi history

on:
  push:
    branches:
      - bootstrap/replay-cyberkimi-v0.1
    paths:
      - .github/workflows/import-cyberkimi.yml
      - bootstrap/CyberKimi.bundle.b64.part-*.txt
      - bootstrap/chunks.sha256

permissions:
  contents: write

concurrency:
  group: import-cyberkimi-history
  cancel-in-progress: false

jobs:
  import-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: bootstrap/replay-cyberkimi-v0.1
          fetch-depth: 0

      - name: Check whether every declared transport segment is present
        id: chunks
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(awk '{print "bootstrap/" $2}' bootstrap/chunks.sha256)
          if [[ "${#parts[@]}" -ne 30 ]]; then
            echo "Unexpected transport manifest size: ${#parts[@]}" >&2
            exit 1
          fi
          missing=0
          for part in "${parts[@]}"; do
            if [[ ! -f "$part" ]]; then
              echo "Missing $part"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Reassemble and verify preserved bundle
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(awk '{print "bootstrap/" $2}' bootstrap/chunks.sha256)
          cat "${parts[@]}" | tr -d '\r\n\t ' > /tmp/CyberKimi.bundle.b64
          echo 'fb3c7c9541d90783c954f3bbd209173606ba0c70e08f070c8aa80ff7f0aa3931  /tmp/CyberKimi.bundle.b64' | sha256sum --check --strict
          base64 --decode /tmp/CyberKimi.bundle.b64 > /tmp/CyberKimi.bundle
          echo '7c86859f3a1434c02024c0e6cf79679509e9d21cc4605f8dc2ae5b0dbd886fc0  /tmp/CyberKimi.bundle' | sha256sum --check --strict
          git bundle verify /tmp/CyberKimi.bundle

      - name: Import exact phase history
        if: steps.chunks.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch /tmp/CyberKimi.bundle \
            refs/heads/build/cyberkimi-v0.1:refs/remotes/preserved/build/cyberkimi-v0.1
          imported_sha="$(git rev-parse refs/remotes/preserved/build/cyberkimi-v0.1)"
          expected_sha='40ceb56ab181175fd673d2966f5f6e019261d39e'
          test "$imported_sha" = "$expected_sha"
          git push origin \
            refs/remotes/preserved/build/cyberkimi-v0.1:refs/heads/build/cyberkimi-v0.1 \
            --force
          remote_sha="$(git ls-remote origin refs/heads/build/cyberkimi-v0.1 | cut -f1)"
          test "$remote_sha" = "$expected_sha"
          echo "Imported CyberKimi phase history at $remote_sha"
