name: Materialize tested source tree

on:
  push:
    branches:
      - complete/cyberkimi-v0.1
    paths:
      - .github/workflows/materialize-source.yml
      - transport/source.tar.gz.b64

permissions:
  contents: write

concurrency:
  group: materialize-cyberkimi-source
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.head_commit.message != 'chore: materialize tested source tree'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete/cyberkimi-v0.1
          fetch-depth: 0

      - name: Exit until transport is complete
        id: transport
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f transport/source.tar.gz.b64 ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Verify and materialize source
        if: steps.transport.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n\t ' < transport/source.tar.gz.b64 | base64 --decode > /tmp/cyberkimi-source.tar.gz
          echo 'e98828687e71805e5f4c4a12f18639e38865849c9dce691de375fc165476ca95  /tmp/cyberkimi-source.tar.gz' | sha256sum --check --strict
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/cyberkimi-source.tar.gz -C .
          rm -rf .state
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Commit actual source files
        if: steps.transport.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: materialize tested source tree'
          git push origin HEAD:complete/cyberkimi-v0.1
