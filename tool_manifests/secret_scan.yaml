internal_id: source.secret_scan@1.0.0
name: source.secret_scan
version: 1.0.0
kimi_alias: source_secret_scan_v1
category: source_analysis
description: Detect candidate assigned secrets in a declared repository; raw values remain local and are vaulted.
accepted_assets: [repository]
arguments_schema:
  type: object
  properties:
    max_results: {type: integer, minimum: 1, maximum: 1000, default: 200}
  additionalProperties: false
base_profile:
  name: restricted
  risk_tier: R1_READ_ONLY
  effects: [file.read, scanner.execute]
  network: false
  filesystem: read_only
  trust_profile: RESTRICTED
  runtime:
    timeout_seconds: 120
    cpu_limit: 1
    memory_mb: 512
    process_limit: 32
    output_bytes: 5000000
