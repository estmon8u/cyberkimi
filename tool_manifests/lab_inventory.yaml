internal_id: lab.inventory@1.0.0
name: lab.inventory
version: 1.0.0
kimi_alias: lab_inventory_v1
category: lab_observation
description: Inventory declared services from a registered lab definition without arbitrary command execution.
accepted_assets: [lab]
arguments_schema:
  type: object
  properties:
    compose_file: {type: string, minLength: 1, maxLength: 1024, default: compose.yaml}
  additionalProperties: false
base_profile:
  name: restricted
  risk_tier: R2_OBSERVATION
  effects: [process.local, container.read]
  network: false
  filesystem: read_only
  trust_profile: RESTRICTED
  runtime:
    timeout_seconds: 30
    cpu_limit: 1
    memory_mb: 256
    process_limit: 16
    output_bytes: 1000000
