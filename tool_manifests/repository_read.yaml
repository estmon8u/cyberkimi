internal_id: repository.read@1.0.0
name: repository.read
version: 1.0.0
kimi_alias: repository_read_v1
category: source_analysis
description: Read a bounded excerpt from a declared repository file.
accepted_assets: [repository]
arguments_schema:
  type: object
  properties:
    path: {type: string, minLength: 1, maxLength: 1024}
    start_line: {type: integer, minimum: 1, maximum: 1000000}
    end_line: {type: integer, minimum: 1, maximum: 1000000}
  required: [path]
  additionalProperties: false
base_profile:
  name: restricted
  risk_tier: R1_READ_ONLY
  effects: [file.read]
  network: false
  filesystem: read_only
  trust_profile: RESTRICTED
  runtime:
    timeout_seconds: 30
    cpu_limit: 1
    memory_mb: 256
    process_limit: 16
    output_bytes: 1000000
